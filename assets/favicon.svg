<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CHIPORT Store">
  <!--
    Круг залит акцентом дизайн-системы (#1447E6), буквы чернильные (#0B1220).
    Шрифт системный, а не Manrope: фавиконка рендерится вне контекста страницы
    и веб-шрифт туда не подгружается.
    Две буквы вместо пяти: во вкладке иконка занимает 16 пикселей, на пять букв
    там приходится по три пикселя и они сливаются.
    Внимание: в комментариях XML нельзя использовать двойной дефис, поэтому
    имена CSS-переменных здесь не пишем, только сами значения цветов.
  -->
  <circle cx="32" cy="32" r="32" fill="#1447E6"/>
  <text x="32" y="42.7"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="30"
        fill="#0B1220">CH</text>
</svg>
